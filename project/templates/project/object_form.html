<!-- Description: Template for displaying a form for creating or editing an object -->
 
{% extends "project/base.html" %}

{% block content %}
<section class="panel">
  <div class="panel-header">
    <h3>{{ page_title|default:"Form" }}</h3>
  </div>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">{{ submit_label|default:"Save changes" }}</button>
    <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
  </form>
</section>
{% endblock %}
