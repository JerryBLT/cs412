<!-- Description: Confirmation page for deleting objects -->
{% extends "project/base.html" %}

{% block content %}
<section class="panel danger">
  <div class="panel-header">
    <h3>{{ page_title|default:"Delete" }}</h3>
  </div>
  <form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete this {{ object_type|default:"object" }} <strong>{{ object_name }}</strong>?</p>
    <button type="submit" class="button danger">Delete</button>
    <a href="{{ cancel_url }}" class="button-link">Cancel</a>
  </form>
</section>
{% endblock %}
